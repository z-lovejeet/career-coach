name: Checks

on:
  push:
    branches: [main, "redesign/**"]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      NEXT_TELEMETRY_DISABLED: 1
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: build-placeholder
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  ml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r ml/requirements.txt
      - name: Exported model is consistent with the processed data
        run: |
          python - <<'PY'
          import json
          model = json.load(open("web/src/server/ml/model/career-model.json"))
          features = json.load(open("data/processed/feature_meta.json"))
          assert [f["id"] for f in model["features"]] == [f["id"] for f in features]
          assert len(model["occupations"]["codes"]) == len(model["occupations"]["z"]) > 800
          print("model ok:", model["version"], model["metrics"])
          PY
