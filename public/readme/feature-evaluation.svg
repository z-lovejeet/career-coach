<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <linearGradient id="evalBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c16" />
      <stop offset="50%" stop-color="#0f1224" />
      <stop offset="100%" stop-color="#07080f" />
    </linearGradient>

    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#181c34" />
      <stop offset="100%" stop-color="#111425" />
    </linearGradient>

    <pattern id="evalGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#252b48" stroke-width="0.5" stroke-opacity="0.25" />
    </pattern>
  </defs>

  <rect width="1200" height="360" rx="16" fill="url(#evalBg)" />
  <rect width="1200" height="360" rx="16" fill="url(#evalGrid)" />
  <rect width="1200" height="360" rx="16" fill="none" stroke="#2a3052" stroke-width="1.2" />

  <!-- Title Bar -->
  <g transform="translate(60, 30)">
    <text x="0" y="0" fill="#818cf8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="0.5">EVALUATION &amp; READINESS ENGINE</text>
    <text x="0" y="24" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="800" letter-spacing="-0.5">Dual-Engine Assessment: Live Mock Rubrics &amp; Company Fit Radar</text>
  </g>

  <!-- PANE 1: Interview Rubric Engine (Left) -->
  <g transform="translate(60, 78)">
    <rect width="525" height="252" rx="12" fill="url(#panelGrad)" stroke="#2f365c" stroke-width="1" />

    <g transform="translate(24, 20)">
      <circle cx="6" cy="8" r="4.5" fill="#10b981" />
      <text x="18" y="12" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">Interview Rubric Evaluation</text>

      <rect x="360" y="-3" width="115" height="22" rx="11" fill="#064e3b" stroke="#059669" stroke-width="0.8" />
      <text x="370" y="12" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">9.2 / 10 Strong hire</text>
    </g>

    <!-- 4 Sub Metrics -->
    <g transform="translate(24, 56)">
      <!-- Box 1 -->
      <g transform="translate(0, 0)">
        <rect width="230" height="54" rx="8" fill="#13162b" stroke="#232948" stroke-width="1" />
        <text x="12" y="20" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600">TIME COMPLEXITY</text>
        <text x="12" y="40" fill="#10b981" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">Strict O(1) Get / Put</text>
      </g>
      <!-- Box 2 -->
      <g transform="translate(245, 0)">
        <rect width="230" height="54" rx="8" fill="#13162b" stroke="#232948" stroke-width="1" />
        <text x="12" y="20" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600">DATA STRUCTURE</text>
        <text x="12" y="40" fill="#818cf8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">Doubly Linked Map</text>
      </g>
      <!-- Box 3 -->
      <g transform="translate(0, 64)">
        <rect width="230" height="54" rx="8" fill="#13162b" stroke="#232948" stroke-width="1" />
        <text x="12" y="20" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600">CONCURRENCY &amp; LOCKS</text>
        <text x="12" y="40" fill="#a78bfa" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">Fine-Grained Mutex</text>
      </g>
      <!-- Box 4 -->
      <g transform="translate(245, 64)">
        <rect width="230" height="54" rx="8" fill="#13162b" stroke="#232948" stroke-width="1" />
        <text x="12" y="20" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600">EDGE CASES</text>
        <text x="12" y="40" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">Sentinel Nodes Verified</text>
      </g>
    </g>

    <!-- Feedback snippet -->
    <g transform="translate(24, 188)">
      <rect width="475" height="42" rx="6" fill="#0d1122" stroke="#1c213c" stroke-width="1" />
      <text x="14" y="26" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11">
        Verdict: "Clear rationale for sentinel nodes eliminating null branch checks during eviction."
      </text>
    </g>
  </g>

  <!-- PANE 2: Readiness Radar & Target Fit (Right) -->
  <g transform="translate(615, 78)">
    <rect width="525" height="252" rx="12" fill="url(#panelGrad)" stroke="#2f365c" stroke-width="1" />

    <g transform="translate(24, 20)">
      <circle cx="6" cy="8" r="4.5" fill="#6366f1" />
      <text x="18" y="12" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">Candidate Readiness Radar</text>

      <rect x="360" y="-3" width="115" height="22" rx="11" fill="#1e1b4b" stroke="#4f46e5" stroke-width="0.8" />
      <text x="370" y="12" fill="#c7d2fe" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">78 / 100 Overall</text>
    </g>

    <!-- 3 Competency Bars -->
    <g transform="translate(24, 56)">
      <!-- Bar 1 -->
      <text x="0" y="12" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600">Algorithms &amp; Data Structures</text>
      <text x="450" y="12" fill="#10b981" font-family="ui-monospace, monospace" font-size="11" font-weight="700">88%</text>
      <rect x="0" y="18" width="475" height="6" rx="3" fill="#1e2444" />
      <rect x="0" y="18" width="418" height="6" rx="3" fill="#10b981" />

      <!-- Bar 2 -->
      <text x="0" y="44" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600">Distributed Systems Architecture</text>
      <text x="450" y="44" fill="#818cf8" font-family="ui-monospace, monospace" font-size="11" font-weight="700">82%</text>
      <rect x="0" y="50" width="475" height="6" rx="3" fill="#1e2444" />
      <rect x="0" y="50" width="389" height="6" rx="3" fill="#818cf8" />

      <!-- Bar 3 -->
      <text x="0" y="76" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600">System Trade-Offs &amp; Communication</text>
      <text x="450" y="76" fill="#a78bfa" font-family="ui-monospace, monospace" font-size="11" font-weight="700">85%</text>
      <rect x="0" y="82" width="475" height="6" rx="3" fill="#1e2444" />
      <rect x="0" y="82" width="403" height="6" rx="3" fill="#a78bfa" />
    </g>

    <!-- Company Fit Badges -->
    <g transform="translate(24, 180)">
      <text x="0" y="0" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600">TARGET COMPANY FIT BENCHMARKS</text>

      <g transform="translate(0, 12)">
        <rect width="112" height="32" rx="6" fill="#13162b" stroke="#252c4e" stroke-width="1" />
        <text x="12" y="20.5" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">Stripe</text>
        <text x="68" y="20.5" fill="#34d399" font-family="ui-monospace, monospace" font-size="11" font-weight="700">84%</text>
      </g>

      <g transform="translate(122, 12)">
        <rect width="112" height="32" rx="6" fill="#13162b" stroke="#252c4e" stroke-width="1" />
        <text x="12" y="20.5" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">Datadog</text>
        <text x="74" y="20.5" fill="#34d399" font-family="ui-monospace, monospace" font-size="11" font-weight="700">89%</text>
      </g>

      <g transform="translate(244, 12)">
        <rect width="112" height="32" rx="6" fill="#13162b" stroke="#252c4e" stroke-width="1" />
        <text x="12" y="20.5" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">Google</text>
        <text x="68" y="20.5" fill="#fbbf24" font-family="ui-monospace, monospace" font-size="11" font-weight="700">76%</text>
      </g>

      <g transform="translate(366, 12)">
        <rect width="109" height="32" rx="6" fill="#13162b" stroke="#252c4e" stroke-width="1" />
        <text x="12" y="20.5" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">Vercel</text>
        <text x="68" y="20.5" fill="#34d399" font-family="ui-monospace, monospace" font-size="11" font-weight="700">86%</text>
      </g>
    </g>
  </g>
</svg>
