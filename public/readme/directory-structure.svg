<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="100%" height="100%">
  <defs>
    <linearGradient id="dirBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c16" />
      <stop offset="50%" stop-color="#0e1225" />
      <stop offset="100%" stop-color="#07080f" />
    </linearGradient>

    <linearGradient id="columnGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#181c34" />
      <stop offset="100%" stop-color="#101323" />
    </linearGradient>

    <pattern id="dirGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#252b48" stroke-width="0.5" stroke-opacity="0.25" />
    </pattern>
  </defs>

  <!-- Container -->
  <rect width="1200" height="480" rx="16" fill="url(#dirBg)" />
  <rect width="1200" height="480" rx="16" fill="url(#dirGrid)" />
