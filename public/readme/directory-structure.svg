      <text x="24" y="18" fill="#94a3b8">└── page.tsx <tspan fill="#64748b">(Hero &amp; Cockpit)</tspan></text>
      
      <text x="0" y="44" fill="#6366f1">├── app/ <tspan fill="#818cf8">(Studio Cockpit)</tspan></text>
