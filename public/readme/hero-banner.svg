<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c16" />
      <stop offset="50%" stop-color="#101328" />
      <stop offset="100%" stop-color="#07080f" />
    </linearGradient>

    <radialGradient id="glowTopLeft" cx="15%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.32" />
      <stop offset="60%" stop-color="#4f46e5" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#0a0c16" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowRight" cx="80%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.25" />
      <stop offset="70%" stop-color="#6366f1" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#07080f" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="45%" stop-color="#e0e7ff" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2238" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#121524" stop-opacity="0.95" />
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4338ca" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.4" />
    </linearGradient>

    <linearGradient id="greenPillGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Filters -->
    <filter id="shadowBox" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <filter id="badgeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#6366f1" flood-opacity="0.45" />
    </filter>

    <!-- Pattern -->
    <pattern id="gridPattern" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#252b48" stroke-width="0.75" stroke-opacity="0.4" />
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="440" rx="20" fill="url(#bgGrad)" />
  <rect width="1200" height="440" rx="20" fill="url(#glowTopLeft)" />
  <rect width="1200" height="440" rx="20" fill="url(#glowRight)" />
  <rect width="1200" height="440" rx="20" fill="url(#gridPattern)" />
  <rect width="1200" height="440" rx="20" fill="none" stroke="url(#borderGrad)" stroke-width="1.5" />

  <!-- LEFT COLUMN: Brand, Title, Subtitle, Badges -->
  <g transform="translate(64, 52)">
    <!-- Eyebrow Pill -->
    <g transform="translate(0, 0)">
      <rect width="254" height="28" rx="14" fill="#1e1b4b" stroke="#4f46e5" stroke-width="1" />
      <circle cx="16" cy="14" r="4" fill="#10b981" />
      <circle cx="16" cy="14" r="7" fill="#10b981" fill-opacity="0.25" />
      <text x="30" y="18" fill="#c7d2fe" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" letter-spacing="0.5">TECHNICAL INTERVIEW OPERATING SYSTEM</text>
    </g>

    <!-- Logo & Main Title -->
    <g transform="translate(0, 48)">
      <!-- Logo Mark Icon -->
      <g transform="translate(0, 0)">
        <rect width="44" height="44" rx="22" fill="url(#accentGrad)" filter="url(#badgeGlow)" />
        <path d="M 27 12 C 23 14 20 16 17 20 C 15 23 13 26 12 30 C 16 27 19 26 22 26 C 25 26 27 27 29 29 C 29 25 27 22 24 20 L 27 12 Z" fill="#ffffff" />
        <circle cx="31" cy="15" r="2" fill="#c7d2fe" />
      </g>
      <text x="56" y="34" fill="url(#titleGrad)" font-family="system-ui, -apple-system, sans-serif" font-size="40" font-weight="800" letter-spacing="-1.2">CareerAI</text>
    </g>

    <!-- Tagline & Description -->
    <text x="0" y="140" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="23" font-weight="700" letter-spacing="-0.5">
      Master technical interviews with structured clarity.
    </text>
    <text x="0" y="172" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="14.5" font-weight="400" line-height="24">
      <tspan x="0" dy="0">Adaptive 52-week engineering curricula, realistic mock rounds with</tspan>
      <tspan x="0" dy="22">rubric-based evaluations, and AI mentorship calibrated for staff benchmarks.</tspan>
    </text>

    <!-- Key Feature Pills -->
    <g transform="translate(0, 235)">
      <g transform="translate(0, 0)">
        <rect width="186" height="32" rx="16" fill="#1e2238" stroke="#3730a3" stroke-width="1" />
        <circle cx="16" cy="16" r="3.5" fill="#6366f1" />
        <text x="28" y="20.5" fill="#e0e7ff" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">Rubric Mock Interviews</text>
      </g>
      <g transform="translate(196, 0)">
        <rect width="176" height="32" rx="16" fill="#1e2238" stroke="#3730a3" stroke-width="1" />
        <circle cx="16" cy="16" r="3.5" fill="#10b981" />
        <text x="28" y="20.5" fill="#e0e7ff" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">52-Week Curricula</text>
      </g>
      <g transform="translate(382, 0)">
        <rect width="172" height="32" rx="16" fill="#1e2238" stroke="#3730a3" stroke-width="1" />
        <circle cx="16" cy="16" r="3.5" fill="#8b5cf6" />
        <text x="28" y="20.5" fill="#e0e7ff" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">Instant Guest Sandbox</text>
      </g>
    </g>

    <!-- Tech Stack Pill Strip -->
    <g transform="translate(0, 290)">
      <rect width="554" height="38" rx="8" fill="#111526" stroke="#1e2540" stroke-width="1" />
      <text x="14" y="24" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">BUILT WITH</text>
      <text x="96" y="24" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600">Next.js 16 (Turbopack) · React 19 · TypeScript 5 · Supabase · Gemini 2.5</text>
    </g>
  </g>

  <!-- RIGHT COLUMN: High-Fidelity Technical Cockpit Mockup -->
  <g transform="translate(680, 42)" filter="url(#shadowBox)">
    <!-- Main Cockpit Container -->
    <rect width="456" height="356" rx="20" fill="url(#cardGrad)" stroke="#3730a3" stroke-width="1.2" />

    <!-- Top Card Bar -->
    <g transform="translate(24, 20)">
      <circle cx="6" cy="10" r="4.5" fill="#10b981" />
      <text x="18" y="14" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700">Technical Evaluation</text>
      <text x="154" y="14" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="11">· Staff benchmark</text>

      <rect x="290" y="0" width="118" height="22" rx="11" fill="#064e3b" stroke="#059669" stroke-width="0.8" />
      <text x="302" y="15" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">9.2 / 10 Strong hire</text>
    </g>

    <!-- Cockpit Tab Segment -->
    <g transform="translate(24, 56)">
      <rect width="408" height="32" rx="8" fill="#121629" stroke="#1e2540" stroke-width="1" />
      <!-- Active Tab -->
      <rect x="3" y="3" width="132" height="26" rx="6" fill="#1e2442" stroke="#4338ca" stroke-width="0.8" />
      <text x="44" y="20" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600">&gt;_ Interview</text>

      <!-- Inactive Tabs -->
      <text x="184" y="20" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="500">Roadmap</text>
      <text x="318" y="20" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="500">Readiness</text>
    </g>

    <!-- Problem Context Box -->
    <g transform="translate(24, 102)">
      <rect width="408" height="96" rx="10" fill="#14182c" stroke="#232948" stroke-width="1" />
      <text x="14" y="22" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">Design a high throughput LRU cache</text>
      <text x="328" y="22" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="500">Round 3 of 5</text>

      <!-- Code Snippet -->
      <rect x="12" y="34" width="384" height="50" rx="6" fill="#0d1020" stroke="#1c223c" stroke-width="1" />
      <text x="22" y="52" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="10" font-weight="400">
        "Doubly linked list combined with hash map lookup.
      </text>
      <text x="22" y="68" fill="#818cf8" font-family="ui-monospace, monospace" font-size="10" font-weight="400">
        Sentinel nodes eliminate null-check branching on O(1) eviction."
      </text>
    </g>

    <!-- Evaluation Breakdown Metrics Grid -->
    <g transform="translate(24, 212)">
      <!-- Metric 1 -->
      <g transform="translate(0, 0)">
        <rect width="130" height="54" rx="8" fill="#14182c" stroke="#232948" stroke-width="1" />
        <text x="12" y="20" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600">COMPLEXITY</text>
        <text x="12" y="40" fill="#10b981" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">Strict O(1)</text>
      </g>
      <!-- Metric 2 -->
      <g transform="translate(139, 0)">
        <rect width="130" height="54" rx="8" fill="#14182c" stroke="#232948" stroke-width="1" />
        <text x="12" y="20" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600">DATA STRUCTURE</text>
        <text x="12" y="40" fill="#818cf8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">Linked Map</text>
      </g>
      <!-- Metric 3 -->
      <g transform="translate(278, 0)">
        <rect width="130" height="54" rx="8" fill="#14182c" stroke="#232948" stroke-width="1" />
        <text x="12" y="20" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600">CONCURRENCY</text>
        <text x="12" y="40" fill="#a78bfa" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">Mutex Safe</text>
      </g>
    </g>

    <!-- Evaluator Verdict Note -->
    <g transform="translate(24, 280)">
      <rect width="408" height="56" rx="8" fill="#0d1124" stroke="#1f2544" stroke-width="1" />
      <circle cx="18" cy="20" r="5" fill="#10b981" />
      <text x="32" y="23" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">Evaluator Verdict</text>
      <text x="32" y="42" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10.5">
        "Strong hire signal: clear explanation of why sentinel nodes eliminate boundary checks."
      </text>
    </g>
  </g>
</svg>
